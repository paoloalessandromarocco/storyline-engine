  <!-- SVG water filter — applied to bg image only, text stays sharp -->
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="water" x="-6%" y="-6%" width="112%" height="112%"
              color-interpolation-filters="sRGB">
        <feTurbulence id="turb"
                      type="turbulence"
                      baseFrequency="0.010 0.014"
                      numOctaves="2"
                      seed="3"
                      result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise"
                           scale="14"
                           xChannelSelector="R"
                           yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <script>
    (function() {
      const turb = document.getElementById('turb');
      let t = 0;
      function animate() {
        t += 0.0018;  // 3× faster than before — motion stays perceptible

        // Three irrational-ratio harmonics per axis — no common plateau
        const fx = (0.010
          + Math.sin(t)          * 0.0030
          + Math.sin(t * 2.730)  * 0.0015
          + Math.sin(t * 0.410)  * 0.0020).toFixed(6);

        const fy = (0.014
          + Math.sin(t * 0.618)  * 0.0040
          + Math.sin(t * 1.870)  * 0.0020
          + Math.cos(t * 3.140)  * 0.0010).toFixed(6);

        turb.setAttribute('baseFrequency', fx + ' ' + fy);
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
