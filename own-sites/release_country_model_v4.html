const TIE_GAP = 2.5;
const GENRE_FIXED_WEIGHT = 5; // genre contributes to score at fixed weight, not user-tunable // score points below which two ranks are treated as a statistical tie

const READING_MODES = {
  absolute:  { label: 'Absolute', hint: 'Bar length = the true 0\u2013100 score, unmodified. Most honest, but weighted averages of several 1\u201310 inputs naturally cluster \u2014 differences can look smaller than they are.' },
  stretched: { label: 'Stretched', hint: 'Bar length rescaled so the lowest country in the current view sits at 0 and the highest at 100. Same ranking, easier to read \u2014 the printed score is still the true one.' },
  contrast:  { label: 'High contrast', hint: 'Stretched further still, pulling mid-range differences apart the most. Good for spotting which slider actually moves the needle; don\u2019t read the bar length as a real percentage.' },
};

function applyReadingMode(rows, mode) {
  if (rows.length === 0) return rows;
  const scores = rows.map((r) => r.score);
  const min = Math.min(...scores);
  const max = Math.max(...scores);
  const span = max - min;

  return rows.map((r) => {
    if (mode === 'absolute' || span === 0) {
      return { ...r, displayScore: r.score };
    }
    const stretched = ((r.score - min) / span) * 100;
    if (mode === 'stretched') {
      return { ...r, displayScore: stretched };
    }
    // contrast: push distances from the midpoint apart with an exponent < 1
    const centered = stretched - 50;
    const pushed = Math.sign(centered) * Math.pow(Math.abs(centered) / 50, 0.6) * 50;
    return { ...r, displayScore: 50 + pushed };
  });
}

function clampScore(v) {
  const n = Number(v);
  if (Number.isNaN(n)) return 1;
  return Math.min(10, Math.max(1, n));
}

  const [genreMode, setGenreMode] = useState('horror');
  const [showTable, setShowTable] = useState(false);

  const activeCriteria = useMemo(
    () => (scenario === 'C' ? [...CRITERIA_ALWAYS, ...CRITERIA_COPROD_ONLY] : CRITERIA_ALWAYS),
    [scenario]
  );

  const totalWeight = useMemo(
    () => activeCriteria.reduce((sum, c) => sum + weights[c.key], 0) || 1,
    [activeCriteria, weights]
  );

  const ranked = useMemo(() => {
    const genreKey = GENRE_MODES[genreMode].field;
    const totalWithGenre = totalWeight + GENRE_FIXED_WEIGHT;
    return Object.entries(data)
      .map(([country, s]) => {
        const scenarioFields = scenario === 'C' ? s.coprod : s.export;
        const raw = {
          demand: s.demand,
          culturalAffinity: s.culturalAffinity,
          urbanConcentration: s.urbanConcentration,
          insider: scenarioFields.insider,
          friction: scenarioFields.friction,
          cost: s.coprod.cost,
          funding: s.coprod.funding,
          crew: s.coprod.crew,
        };
        // genre contributes at fixed weight (not user-tunable)
        const weighted = activeCriteria.reduce((sum, c) => sum + weights[c.key] * raw[c.key], 0)
                       + GENRE_FIXED_WEIGHT * s[genreKey];
        const score = (weighted / totalWithGenre / 10) * 100;

        // Data confidence: weighted avg of per-criterion source quality (1-10 each)
        const confRaw = {
          demand: s.conf.demand,
          culturalAffinity: s.conf.culturalAffinity,
          urbanConcentration: s.conf.urbanConcentration,
          insider: s.conf.insider,
          friction: s.conf.friction,
          cost: s.conf.cost,
          funding: s.conf.funding,
          crew: s.conf.crew,
        };
        const confWeighted = activeCriteria.reduce((sum, c) => sum + weights[c.key] * confRaw[c.key], 0)
                           + GENRE_FIXED_WEIGHT * s.conf[genreKey];
        const confidence = Math.round((confWeighted / totalWithGenre / 10) * 100);

        return { country, score, confidence, note: s.note };
      })
      .sort((a, b) => b.score - a.score);
  }, [data, weights, totalWeight, genreMode, scenario, activeCriteria]);


  const updateWeight = (key, val) => setWeights((w) => ({ ...w, [key]: Number(val) }));
  const updateScore = (country, group, key, val) =>
    setData((d) => {
      if (group === 'shared') return { ...d, [country]: { ...d[country], [key]: clampScore(val) } };
      return { ...d, [country]: { ...d[country], [group]: { ...d[country][group], [key]: clampScore(val) } } };
    });
  const reset = () => {
    setWeights(DEFAULT_WEIGHTS);
    setData(DEFAULT_DATA);
    setGenreMode('horror');
    setScenario('C');
  };

        }
        *{box-sizing:border-box;}
        .wrap{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:28px; border-radius:6px; min-height:100%; }
        .header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px; }
        .title-block{ display:flex; align-items:center; gap:12px; }
        .slate{ width:38px;height:38px;border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--brass), var(--brass-dark)); display:flex;align-items:center;justify-content:center; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.15); flex-shrink:0; }
        h1{ font-family:'Fraunces',serif; font-weight:650; font-style:italic; color:var(--panel); font-size:26px; margin:0; letter-spacing:-0.01em; }
        .subtitle{ color:#C9C3B3; font-size:12.5px; margin-top:2px; font-family:'IBM Plex Mono',monospace; }
        .reset-btn{ display:flex; align-items:center; gap:6px; background:transparent; border:1px solid rgba(246,241,228,0.35); color:#E8E2D2; padding:8px 14px; border-radius:4px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; cursor:pointer; transition:all .15s; }
        .reset-btn:hover{ background:rgba(246,241,228,0.1); border-color:var(--brass); }

        .scenario-toggle{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
        @media (max-width:640px){ .scenario-toggle{ grid-template-columns:1fr; } }
        .scenario-card{ text-align:left; padding:14px 16px; border-radius:6px; cursor:pointer; border:1.5px solid rgba(246,241,228,0.25); background:rgba(246,241,228,0.05); transition:all .15s; }
        .scenario-card:hover{ border-color:rgba(192,138,62,0.6); }
        .scenario-card.active{ background:var(--panel); border-color:var(--brass); }
        .scenario-card-label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:0.03em; color:#E8E2D2; margin-bottom:4px; }
        .scenario-card.active .scenario-card-label{ color:var(--ink); }
        .scenario-card-desc{ font-size:11.5px; line-height:1.45; color:#B7B0A0; }
        .scenario-card.active .scenario-card-desc{ color:var(--ink-soft); }

        .genre-toggle{ display:flex; flex-wrap:wrap; gap:0; margin-bottom:10px; border:1px solid rgba(246,241,228,0.3); border-radius:4px; overflow:hidden; width:fit-content; }
        .genre-toggle button{ padding:9px 14px; background:transparent; border:none; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#C9C3B3; transition:all .15s; border-right:1px solid rgba(246,241,228,0.15); }
        .genre-toggle button:last-child{ border-right:none; }
        .genre-toggle button.active{ background:var(--brass); color:#211804; font-weight:600; }
        .genre-caveat{ font-size:11.5px; color:#C9C3B3; font-family:'IBM Plex Mono',monospace; line-height:1.5; margin-bottom:22px; max-width:640px; }

        .grid{ display:grid; grid-template-columns: 300px 1fr; gap:20px; }
        @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }

        .panel{ background:var(--panel); border-radius:6px; padding:20px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
        .panel-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-bottom:16px; }

        .fader{ margin-bottom:16px; }
        .fader:last-child{ margin-bottom:0; }
        .fader-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
        .fader-label{ font-size:13px; font-weight:600; }
        .fader-val{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--brass-dark); }
        .fader-hint{ font-size:11px; color:var(--ink-soft); margin-bottom:6px; line-height:1.35; }
        input[type=range]{ -webkit-appearance:none; width:100%; height:4px; border-radius:2px; background:linear-gradient(to right, var(--brass) var(--pct,50%), var(--line) var(--pct,50%)); outline:none; }
        input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px;height:14px;border-radius:50%; background:var(--brass-dark); cursor:pointer; border:2px solid var(--panel); box-shadow:0 0 0 1px var(--brass-dark); }

        .coprod-only-note{ font-size:10.5px; color:var(--ink-soft); font-style:italic; margin-top:2px; }

        .meter-row{ margin-bottom:18px; }
        .meter-row:last-child{ margin-bottom:0; }
        .meter-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
        .country-name{ font-family:'Fraunces',serif; font-weight:650; font-size:16.5px; }
        .rank-num{ font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:400; color:var(--ink-soft); opacity:0.55; margin-right:7px; }
        .score-num{ font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; color:var(--brass-dark); }
        .tie-chip{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft); border:1px solid var(--line); border-radius:3px; padding:1px 6px; margin-left:8px; vertical-align:middle; white-space:nowrap; }
        .meter-track{ height:14px; background:var(--panel-soft); border-radius:3px; overflow:hidden; position:relative; border:1px solid var(--line); }
        .meter-fill{ height:100%; background:linear-gradient(90deg, var(--brass-dark), var(--brass)); transition:width .4s cubic-bezier(.4,0,.2,1); position:relative; }
        .meter-ticks{ position:absolute; inset:0; display:flex; justify-content:space-between; pointer-events:none; }
        .meter-ticks span{ width:1px; background:rgba(30,36,48,0.08); }
        .meter-note{ font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.45; }
        .score-block{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
        .conf-chip{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.02em; }


        .table-hint{ font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-bottom:10px; }

        .table-toggle{ margin-top:22px; background:none; border:none; color:var(--brass-dark); font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
        .score-table-wrap{ overflow-x:auto; margin-top:14px; }
        table{ border-collapse:collapse; width:100%; min-width:980px; }
        th,td{ padding:7px 9px; text-align:center; font-size:12px; border-bottom:1px solid var(--line); }
        th{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink-soft); text-transform:uppercase; font-size:9.5px; letter-spacing:0.04em; }
        td:first-child, th:first-child{ text-align:left; font-family:'Fraunces',serif; font-weight:600; font-size:13px; }
        td input{ width:36px; text-align:center; border:1px solid var(--line); border-radius:3px; font-family:'IBM Plex Mono',monospace; font-size:12px; padding:3px 2px; background:#fff; }
        td input:focus{ outline:none; border-color:var(--brass); }

        .footnote{ margin-top:18px; font-size:11.5px; color:#B7B0A0; font-family:'IBM Plex Mono',monospace; line-height:1.5; }
      `}</style>

      <div className="header">
        <div className="title-block">
          <div className="slate"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#211804" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg></div>
          <div>
            <h1>Where to release, first cut</h1>
            <div className="subtitle">weighted scoring model · v4 · production always anchored in Italy · 16 candidate markets · 8 genre lenses</div>
          </div>
        </div>
        <button className="reset-btn" onClick={reset}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.51"/></svg> Reset to defaults</button>
      </div>

      <div className="scenario-toggle">
        {Object.entries(SCENARIOS).map(([key, s]) => (
          <div key={key} className={`scenario-card ${scenario === key ? 'active' : ''}`} onClick={() => setScenario(key)}>
            <div className="scenario-card-label">{s.label}</div>
            <div className="scenario-card-desc">{s.desc}</div>
          </div>
        ))}
      </div>

      <div className="genre-toggle">
        {Object.entries(GENRE_MODES).map(([key, g]) => (
          <button key={key} className={genreMode === key ? 'active' : ''} onClick={() => setGenreMode(key)}>{g.label}</button>
        ))}
      </div>
      {GENRE_CAVEATS[genreMode] && (
        <div className="genre-caveat">{GENRE_CAVEATS[genreMode]}</div>
      )}

      <div className="grid">
        <div className="panel">
          <div className="panel-label"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg> Your priorities</div>
          {CRITERIA_ALWAYS.map((c) => {
            const pct = `${(weights[c.key] / 10) * 100}%`;
            return (
              <div className="fader" key={c.key}>
                <div className="fader-top"><span className="fader-label">{c.label}</span><span className="fader-val">{weights[c.key]}</span></div>
                <div className="fader-hint">{c.key === 'genre' ? `${c.hint} (active: ${GENRE_MODES[genreMode].label})` : c.hint}</div>
                <input type="range" min="0" max="10" step="1" value={weights[c.key]} style={{ '--pct': pct }} onChange={(e) => updateWeight(c.key, e.target.value)} />
              </div>
            );
          })}
          {scenario === 'C' && CRITERIA_COPROD_ONLY.map((c) => {
            const pct = `${(weights[c.key] / 10) * 100}%`;
            return (
              <div className="fader" key={c.key}>
                <div className="fader-top"><span className="fader-label">{c.label}</span><span className="fader-val">{weights[c.key]}</span></div>
                <div className="fader-hint">{c.hint}</div>
                <input type="range" min="0" max="10" step="1" value={weights[c.key]} style={{ '--pct': pct }} onChange={(e) => updateWeight(c.key, e.target.value)} />
              </div>
            );
          })}
          {scenario === 'B' && <div className="coprod-only-note">Cost, funding and crew are hidden in scenario B — production spend stays in Italy, so it doesn't vary by release country.</div>}
        </div>

        <div className="panel">
          <div className="panel-label"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> Country score — {SCENARIOS[scenario].short} · {GENRE_MODES[genreMode].label}</div>

          {ranked.map((r, i) => {
            const isTie = i > 0 && (ranked[i - 1].score - r.score) < TIE_GAP;
            return (
              <div className="meter-row" key={r.country}>
                <div className="meter-top">
                  <span>
                    <span className="rank-num">{i + 1}</span>
                    <span className="country-name">{r.country}</span>
                    {isTie && <span className="tie-chip">≈ tie with #{i}</span>}
                  </span>
                  <span className="score-block">
                    <span className="score-num">{r.score.toFixed(1)}</span>
                    <span className="conf-chip" style={{color: r.confidence >= 70 ? '#4e8b5a' : r.confidence >= 50 ? 'var(--ink-soft)' : 'var(--red)'}}>~{r.confidence}% data</span>
                  </span>
                </div>
                <div className="meter-track">
                  <div className="meter-fill" style={{ width: `${r.score}%` }} />
                  <div className="meter-ticks">{Array.from({ length: 9 }).map((_, k) => <span key={k} />)}</div>
                </div>
                <div className="meter-note">{r.note}</div>
              </div>
            );
          })}

          <button className="table-toggle" onClick={() => setShowTable((s) => !s)}>
            {showTable ? 'Hide the country × criteria matrix' : 'Edit the country × criteria matrix — this is where every raw score above comes from'}
          </button>

          {showTable && (
            <div className="score-table-wrap">
              <div className="table-hint">Every number below is a raw 1–10 score. Change one and every bar above recalculates instantly using your current priority weights.</div>
              <table>
                <thead>
                  <tr>
                    <th>Country</th>
                    <th>Demand</th>
                    <th>Cultural</th>
                    <th>Urban</th>
                    {genreCols.map((g) => <th key={g.field}>G·{g.label}</th>)}
                    <th>Insider ({SCENARIOS[scenario].short})</th>
                    <th>Access ({SCENARIOS[scenario].short})</th>
                    {scenario === 'C' && <th>Cost</th>}
                    {scenario === 'C' && <th>Funding</th>}
                    {scenario === 'C' && <th>Crew</th>}
                  </tr>
                </thead>
                <tbody>
                  {Object.entries(data).map(([country, s]) => (
                    <tr key={country}>
                      <td>{country}</td>
                      <td><input type="number" min="1" max="10" value={s.demand} onChange={(e) => updateScore(country, 'shared', 'demand', e.target.value)} /></td>
                      <td><input type="number" min="1" max="10" value={s.culturalAffinity} onChange={(e) => updateScore(country, 'shared', 'culturalAffinity', e.target.value)} /></td>
                      <td><input type="number" min="1" max="10" value={s.urbanConcentration} onChange={(e) => updateScore(country, 'shared', 'urbanConcentration', e.target.value)} /></td>
                      {genreCols.map((g) => (
                        <td key={g.field}><input type="number" min="1" max="10" value={s[g.field]} onChange={(e) => updateScore(country, 'shared', g.field, e.target.value)} /></td>
                      ))}
                      <td><input type="number" min="1" max="10" value={s[scenario === 'C' ? 'coprod' : 'export'].insider} onChange={(e) => updateScore(country, scenario === 'C' ? 'coprod' : 'export', 'insider', e.target.value)} /></td>
                      <td><input type="number" min="1" max="10" value={s[scenario === 'C' ? 'coprod' : 'export'].friction} onChange={(e) => updateScore(country, scenario === 'C' ? 'coprod' : 'export', 'friction', e.target.value)} /></td>
                      {scenario === 'C' && <td><input type="number" min="1" max="10" value={s.coprod.cost} onChange={(e) => updateScore(country, 'coprod', 'cost', e.target.value)} /></td>}
                      {scenario === 'C' && <td><input type="number" min="1" max="10" value={s.coprod.funding} onChange={(e) => updateScore(country, 'coprod', 'funding', e.target.value)} /></td>}
                      {scenario === 'C' && <td><input type="number" min="1" max="10" value={s.coprod.crew} onChange={(e) => updateScore(country, 'coprod', 'crew', e.target.value)} /></td>}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div className="footnote">
            <strong>How to read this:</strong> each cell in the matrix is a <em>raw score</em> (1–10) — one country, one criterion,
            before weighting. The sliders set how much <em>you</em> care about each criterion. The bar and number per country is the
            <em>weighted score</em> (0–100): every raw score × its slider weight, summed and rescaled. Genre-market fit contributes
            at a fixed weight and updates when you switch genre above. Rank is just the sort order — move sliders to change scores,
            not to chase a rank.
          </div>
          <div className="footnote">
            <strong>~XX% data</strong> is a rough coverage estimate: the fraction of this country's score that rests on published
            sources (box office statistics, treaty texts, fund regulations, crew-rate databases) rather than informed guesses.
            Green ≥70% · grey 50–69% · red &lt;50%. It shifts with genre (some genre/market combinations are well-studied, others
            barely documented) and with your priority weights (if you weight a criterion with poor data coverage heavily, overall
            confidence drops). Use it as a sanity check, not a guarantee — the underlying scores are still estimates.
          </div>
          <div className="footnote">
            Scores are estimates, not measurements. Insider &amp; access columns switch definition with the scenario toggle above:
            in Co-production they reflect quasi-domestic status under a treaty; in Export they reflect a straight foreign import
            with no treaty leverage. The ≈ chip flags near-ties: when two countries land within {TIE_GAP} points, the ranking
            between them is noise — don't let the model pretend a precision it doesn't have.
          </div>
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReleaseCountryModel />);
  </script>
</body>
</html>
